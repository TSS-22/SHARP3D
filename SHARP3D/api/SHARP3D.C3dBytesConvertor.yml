  assemblies:
  - SHARP3D
  namespace: SHARP3D
  summary: This helper class provide functions to process C3D bytes according to the file maker processor type for compatibility purposes.
  remarks: >-
    The functions:

    <ul><li><xref href="SHARP3D.C3dBytesConvertor.LittleEndianFloatToVaxFloatByte(System.Single)" data-throw-if-not-resolved="false"></xref></li><li><xref href="SHARP3D.C3dBytesConvertor.BigEndianFloatToVaxF(System.Single)" data-throw-if-not-resolved="false"></xref></li><li><xref href="SHARP3D.C3dBytesConvertor.VaxFToLittleEndianFloat(System.Byte%5b%5d)" data-throw-if-not-resolved="false"></xref></li><li><xref href="SHARP3D.C3dBytesConvertor.VaxFToBigEndianFloat(System.Byte%5b%5d)" data-throw-if-not-resolved="false"></xref></li></ul>

    are modifications of the code from [njuffa](https://stackoverflow.com/users/780717/njuffa) at the quesiton [Floating Point numbers on VAX machine](https://stackoverflow.com/questions/71689829/floating-point-numbers-on-vax-machine).

