  assemblies:
  - SHARP3D
  namespace: SHARP3D.Parameter
  summary: Parses C3D parameter groups and parameters from a file stream.
  remarks: >-
    <p>

    Empty groups (which have no parameters linked to them) are discarded. This is implemented due to Vicon potentially adding twice PROCESSING group, once empty and once with the actual parameters.

    </p>


    TODO: Handle UTF-8 error cases as per https://en.wikipedia.org/wiki/UTF-8#Error_handling
  example: []
  syntax:
    content: public static List<C3dParameterGroup> ParametersFromFileStreams(FileStream c3dStream, ProcessorType processorFile, int pointerParameterSection, int pointerDataSection)
    parameters:
    - id: c3dStream
      type: System.IO.FileStream
      description: The file stream of the C3D file.
    - id: processorFile
      type: SHARP3D.Utils.Enum.ProcessorType
      description: The processor type used in the C3D file.
    - id: pointerParameterSection
      type: System.Int32
      description: The pointer to the parameter section in the C3D file.
    - id: pointerDataSection
      type: System.Int32
      description: The pointer to the data section in the C3D file.
    return:
      type: System.Collections.Generic.List{SHARP3D.Parameter.Data.C3dParameterGroup}
      description: A list of <xref href="SHARP3D.Parameter.Data.C3dParameterGroup" data-throw-if-not-resolved="false"></xref> parsed from the file stream.
    content.vb: Public Shared Function ParametersFromFileStreams(c3dStream As FileStream, processorFile As ProcessorType, pointerParameterSection As Integer, pointerDataSection As Integer) As List(Of C3dParameterGroup)
