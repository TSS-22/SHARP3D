- uid: SHARP3D.Header.C3dHeader.ScaleFactor
  commentId: F:SHARP3D.Header.C3dHeader.ScaleFactor
  id: ScaleFactor
  parent: SHARP3D.Header.C3dHeader
  langs:
  - csharp
  - vb
