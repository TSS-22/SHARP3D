  - SHARP3D
  namespace: SHARP3D.Header
  summary: >-
    <p>
     Word: 3
    </p>

     The total number of analog channels stored in each 3D frame. If no analog data is stored, this value is zero.
  remarks: "This parameter encompass the total analog sample recorded and can be confusing. For example if you have a force plate with 6 channels recording at 4 times the 3D marker acquisition rate, then the value of that variable should be: 4 * 6 = 24. But even this doesn't match the value from the test files."
  example: []
  syntax:
    content: public int AnalogSamplesPerFrame
    return:
      type: System.Int32
    content.vb: Public AnalogSamplesPerFrame As Integer
