      repo: https://github.com/TSS-22/SHARP3D.git
    id: VectorToMatrix
    path: SHARP3D/Utils/Fortran.cs
    startLine: 37
  assemblies:
  - SHARP3D
  namespace: SHARP3D.Utils
  summary: Converts a Fortran-style vector to a C# multi-dimensional matrix.
  example:
  - >-
    <pre><code class="lang-csharp">byte[] vector = new byte[] { 1, 0, 2, 0, 3, 0, 4, 0 };

    int[] dimensions = new int[] { 2, 2 };

    Array matrix = Fortran.VectorToMatrix&lt;short&gt;(vector, dimensions, DataType.INT16, ProcessorType.INTEL);</code></pre>
  syntax:
    content: public static Array VectorToMatrix<T>(byte[] vector, int[] dimensions, DataType dataTypeFile, ProcessorType processor = ProcessorType.UNKOWN)
    parameters:
    - id: vector
      type: System.Byte[]
      description: The byte array representing the Fortran-style vector.
    - id: dimensions
      type: System.Int32[]
      description: The dimensions of the resulting matrix.
    - id: dataTypeFile
      type: SHARP3D.Utils.Enum.DataType
      description: The data type of the elements in the vector.
    - id: processor
      type: SHARP3D.Utils.Enum.ProcessorType
      description: The processor type used for data conversion (required for INT16 and FLOAT32 data types).
    typeParameters:
    - id: T
      description: The type of elements in the matrix.
    return:
      type: System.Array
      description: A multi-dimensional array representing the matrix.
    content.vb: Public Shared Function VectorToMatrix(Of T)(vector As Byte(), dimensions As Integer(), dataTypeFile As DataType, processor As ProcessorType = ProcessorType.UNKOWN) As Array
  overload: SHARP3D.Utils.Fortran.VectorToMatrix*
  exceptions:
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: >-
      Thrown when:


      <ul><li>The data vector is empty.</li><li>The data vector length doesn't match the expected size based on dimensions and data type.</li><li>The dimensions array is empty or invalid.</li><li>An unsupported data type is provided.</li><li>The processor type is unknown for INT16 or FLOAT32 data types.</li></ul>
  nameWithType.vb: Fortran.VectorToMatrix(Of T)(Byte(), Integer(), DataType, ProcessorType)
