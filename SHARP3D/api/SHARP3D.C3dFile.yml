    id: GetAnalogSamplePerFrame
    path: SHARP3D/C3dFile.cs
    startLine: 397
  assemblies:
  - SHARP3D
  namespace: SHARP3D
  summary: Calculates the number of analog samples per 3D frame.
  remarks: >-
    The result is calculated as the ratio of <code class="paramref">analogRate</code> to <code class="paramref">pointRate</code>.

    If this ratio is not an integer, the function will try to recover this value from the word 10 of the header, according to the page 27 of the <a href="https://www.c3d.org/docs/C3D_User_Guide.pdf">C3D User guide</a>, as the C3D file format requires this ratio to be an integer.

    We started using the division of the analog rate and the point rate due to the descriptions in the Data sectin of the guide and because some files don't have an actual valid value in WORD 10 of the C3D headers, but some badly formatted files require the use of WORD 10 of the C3D headers.
  example: []
  syntax:
    content: internal int GetAnalogSamplePerFrame(float pointRate, float analogRate)
    parameters:
    - id: pointRate
      type: System.Single
      description: The acquisition rate of the 3D point data, in Hz.
    - id: analogRate
      type: System.Single
      description: The acquisition rate of the analog data, in Hz.
    return:
      type: System.Int32
      description: The number of analog samples per 3D frame, as an integer.
    content.vb: Friend Function GetAnalogSamplePerFrame(pointRate As Single, analogRate As Single) As Integer
  overload: SHARP3D.C3dFile.GetAnalogSamplePerFrame*
  nameWithType.vb: C3dFile.GetAnalogSamplePerFrame(Single, Single)
  fullName.vb: SHARP3D.C3dFile.GetAnalogSamplePerFrame(Single, Single)
  name.vb: GetAnalogSamplePerFrame(Single, Single)
- uid: SHARP3D.C3dFile.GetRightAmountOfFrames
  commentId: M:SHARP3D.C3dFile.GetRightAmountOfFrames
  id: GetRightAmountOfFrames
  parent: SHARP3D.C3dFile
  langs:
  - csharp
  - vb
  name: GetRightAmountOfFrames()
  nameWithType: C3dFile.GetRightAmountOfFrames()
  fullName: SHARP3D.C3dFile.GetRightAmountOfFrames()
  type: Method
  source:
    remote:
      path: SHARP3D/SHARP3D/C3dFile.cs
      branch: dev
      repo: https://github.com/TSS-22/SHARP3D.git
    id: GetRightAmountOfFrames
    path: SHARP3D/C3dFile.cs
    startLine: 456
  assemblies:
  - SHARP3D
  namespace: SHARP3D
  summary: >-
    Determines the correct number of frames in a C3D file by attempting to retrieve the value

    from multiple parameter sources, as specified in the C3D User Guide.
  remarks: >-
    The function follows the C3D User Guide's recommendations for determining the number of frames:


    <ol><li>
          Attempts to retrieve the value from the "point/long_frames" parameter (pages 93-94).
          If successful, returns the value; otherwise, proceeds to the next method.
        </li><li>
          Attempts to calculate the number of frames using the "trial/actual_start_field" and
          "trial/actual_end_field" parameters (pages 99-101). The number of frames is calculated as:

          <pre><code class="lang-csharp">(lastFrame - firstFrame + 1)</code></pre>

          where <code>firstFrame</code> and <code>lastFrame</code> are derived from the parameter values.
        </li><li>
          Falls back to retrieving the value from the "point/frames" parameter (page 66).
          If all else fails, returns 0 as a default value.
        </li></ol>
  example: []
  syntax:
    content: internal int GetRightAmountOfFrames()
    return:
      type: System.Int32
      description: >-
        The number of frames in the C3D file, as determined by the first successfully retrieved or calculated value.

        Returns 0 if no valid value can be determined.
    content.vb: Friend Function GetRightAmountOfFrames() As Integer
  overload: SHARP3D.C3dFile.GetRightAmountOfFrames*
  exceptions:
  - type: SHARP3D.Exceptions.ParameterNotFoundException
    commentId: T:SHARP3D.Exceptions.ParameterNotFoundException
    description: Thrown internally if a parameter is not found, but caught and ignored to allow fallback to other methods.
