  nameWithType: C3dFile.GetRightAmountMarkerPerFrame(int, int, int, int, int, int, long, DataType)
  fullName: SHARP3D.C3dFile.GetRightAmountMarkerPerFrame(int, int, int, int, int, int, long, SHARP3D.Utils.Enum.DataType)
