    id: GetAnalogSamplePerFrame
    path: SHARP3D/C3dFile.cs
    startLine: 789
  assemblies:
  - SHARP3D
  namespace: SHARP3D
  summary: Calculates the number of analog samples per 3D frame.
  remarks: >-
    The result is calculated as the ratio of <code class="paramref">analogRate</code> to <code class="paramref">pointRate</code>.

    If this ratio is not an integer, the function will try to recover this value from the word 10 of the header, according to the page 27 of the <a href="https://www.c3d.org/docs/C3D_User_Guide.pdf">C3D User guide</a>, as the C3D file format requires this ratio to be an integer.

    We started using the division of the analog rate and the point rate due to the descriptions in the Data sectin of the guide and because some files don't have an actual valid value in WORD 10 of the C3D headers, but some badly formatted files require the use of WORD 10 of the C3D headers.
  example: []
  syntax:
    content: internal int GetAnalogSamplePerFrame(float pointRate, float analogRate)
    parameters:
    - id: pointRate
      type: System.Single
      description: The acquisition rate of the 3D point data, in Hz.
    - id: analogRate
      type: System.Single
      description: The acquisition rate of the analog data, in Hz.
    return:
      type: System.Int32
      description: The number of analog samples per 3D frame, as an integer.
    content.vb: Friend Function GetAnalogSamplePerFrame(pointRate As Single, analogRate As Single) As Integer
  overload: SHARP3D.C3dFile.GetAnalogSamplePerFrame*
  nameWithType.vb: C3dFile.GetAnalogSamplePerFrame(Single, Single)
  fullName.vb: SHARP3D.C3dFile.GetAnalogSamplePerFrame(Single, Single)
  name.vb: GetAnalogSamplePerFrame(Single, Single)
