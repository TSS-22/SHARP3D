  source:
    remote:
      path: SHARP3D/SHARP3D/C3dFile.cs
      branch: dev
      repo: https://github.com/TSS-22/SHARP3D.git
    id: GetRightAmountMarkerPerFrame
    path: SHARP3D/C3dFile.cs
    startLine: 597
  assemblies:
  - SHARP3D
  namespace: SHARP3D
  summary: Return the right amount of marker per frame.
  remarks: >-
    Some file have bad construction and features wrong value in either HEADER:POINT:USED or PARAMETER:POINT:USED. Reading them then comes down to luck.

    Despite the fact that the creator of those file messed up, they might still be usable.

    We assume the followin values to be always truthful:


    <ul><li>PARAMETER:POINT:FRAME</li><li>PARAMETER:POINT:RATE</li><li>PARAMETER:ANALOG:RATE</li></ul>


    And that at least either the HEADER or PARAMETER value of POINT:USED is truthful.
  example: []
  syntax:
    content: internal int GetRightAmountMarkerPerFrame(int frameNumber, int analogChannels, int analogSamplePerFrame, int headerPointUsed, int parameterPointUsed, int pointerDataSection, long c3dStreamLength, DataType dataTypeFile)
    parameters:
    - id: frameNumber
      type: System.Int32
      description: The number of frame in the C3D file.
    - id: analogChannels
      type: System.Int32
      description: The number of analog channels.
    - id: analogSamplePerFrame
      type: System.Int32
      description: The number of analog sample per Data Frame.
    - id: headerPointUsed
      type: System.Int32
      description: The value of POINT:USED present from the Header section.
    - id: parameterPointUsed
      type: System.Int32
      description: The value of POINT:USED present from the Parameter section.
    - id: pointerDataSection
      type: System.Int32
      description: The value the pointer to the Data section.
    - id: c3dStreamLength
      type: System.Int64
      description: The length in bytes of the C3D file.
    - id: dataTypeFile
      type: SHARP3D.Utils.Enum.DataType
      description: The <xref href="SHARP3D.Utils.Enum.DataType" data-throw-if-not-resolved="false"></xref> of the C3D file.
    return:
      type: System.Int32
      description: The actual amount of marker per frame.
    content.vb: Friend Function GetRightAmountMarkerPerFrame(frameNumber As Integer, analogChannels As Integer, analogSamplePerFrame As Integer, headerPointUsed As Integer, parameterPointUsed As Integer, pointerDataSection As Integer, c3dStreamLength As Long, dataTypeFile As DataType) As Integer
  overload: SHARP3D.C3dFile.GetRightAmountMarkerPerFrame*
  exceptions:
  - type: SHARP3D.Exceptions.C3dBadFormatingException
    commentId: T:SHARP3D.Exceptions.C3dBadFormatingException
    description: Thrown if no value of POINT:USED is valid for the amount of frame in the file.
  nameWithType.vb: C3dFile.GetRightAmountMarkerPerFrame(Integer, Integer, Integer, Integer, Integer, Integer, Long, DataType)
