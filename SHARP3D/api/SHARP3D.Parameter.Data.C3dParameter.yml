  assemblies:
  - SHARP3D
  namespace: SHARP3D.Parameter.Data
  summary: Represents a parameter in a C3D file, including its metadata, data type, dimensions, and data.
  remarks: >-
    <p>

    Byte: 1

    Reserved for parameter file use.

    </p>

    <p>

    Byte: 2

    Reserved for parameter file use.

    </p>

    <p>

    Byte: 3

    Parameter section size in 512 byte blocks.

    </p>

    <p>

    Byte: 4

    Processor type.


    <p>

    Value = 0x53 + processor type

    </p>

    <p>

    Value (in decimal) = 83 + processor type

    </p>

    <table><tbody><tr><td class="term">0x54</td><td class="description">Processor type 1: INTEL</td></tr><tr><td class="term">0x55</td><td class="description">Processor type 2: DEC (VAX,PDP-11)</td></tr><tr><td class="term">0x56</td><td class="description">Processor type 3: MIPS (SGI/MIPS)</td></tr></tbody></table>

    </p>
