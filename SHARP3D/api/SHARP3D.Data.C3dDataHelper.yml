  assemblies:
  - SHARP3D
  namespace: SHARP3D.Data
  summary: Determines if a point is valid based on camera/sign byte, point values, and camera mask.
  remarks: This value can't be trusted. Some people don't log it as specified in the C3D Guidelines. We tried our best to make it work reliably, but if you have any issue with a file, please contact us about it.
  example: []
  syntax:
    content: internal static bool IsValid(byte camAndSign, float[] pointValue, bool[] cameraMask, C3dDataContext context)
    parameters:
    - id: camAndSign
      type: System.Byte
      description: The camera and sign byte.
    - id: pointValue
      type: System.Single[]
      description: The point values.
    - id: cameraMask
      type: System.Boolean[]
      description: The camera mask.
    - id: context
      type: SHARP3D.Data.Data.C3dDataContext
      description: The <xref href="SHARP3D.Data.Data.C3dDataContext" data-throw-if-not-resolved="false"></xref> containing file stream and metadata.
    return:
      type: System.Boolean
      description: True if the point is valid; otherwise, false.
    content.vb: Friend Shared Function IsValid(camAndSign As Byte, pointValue As Single(), cameraMask As Boolean(), context As C3dDataContext) As Boolean
