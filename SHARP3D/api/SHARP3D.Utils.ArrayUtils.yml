  assemblies:
  - SHARP3D
  namespace: SHARP3D.Utils
  summary: Determines whether the base elements of a jagged or multi-dimensional array are of type <xref href="System.String" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    This method recursively drills down to the innermost element type of the array.

    For example:


    <ul><li><code>string[][]</code> returns <code>true</code> because the base element is <xref href="System.String" data-throw-if-not-resolved="false"></xref>.</li><li><code>string[][][]</code> returns <code>true</code> because the base element is <xref href="System.String" data-throw-if-not-resolved="false"></xref>.</li><li><code>int[][]</code> returns <code>false</code> because the base element is <code>int</code>.</li><li><code>object[][]</code> returns <code>false</code> because the base element is <xref href="System.Object" data-throw-if-not-resolved="false"></xref>.</li></ul>
  example:
  - >-
    <pre><code class="lang-csharp">string[][] jaggedStringArray = new string[2][];

    jaggedStringArray[0] = new string[] { "hello", "world" };

    bool isString = IsBaseElementString(jaggedStringArray); // Returns true</code></pre>
  syntax:
    content: public static bool IsBaseElementString(Array array)
    parameters:
    - id: array
      type: System.Array
      description: The input array to check. Can be a jagged array (e.g., <code>string[][]</code>) or multi-dimensional array.
    return:
      type: System.Boolean
      description: >-
        <code>true</code> if the innermost elements of the array are of type <xref href="System.String" data-throw-if-not-resolved="false"></xref>;

        <code>false</code> if the array is <code>null</code>, empty, or the base elements are not <xref href="System.String" data-throw-if-not-resolved="false"></xref>.
    content.vb: Public Shared Function IsBaseElementString(array As Array) As Boolean
  overload: SHARP3D.Utils.ArrayUtils.IsBaseElementString*
