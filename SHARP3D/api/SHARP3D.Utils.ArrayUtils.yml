    id: IsBaseElementPrimitive
    path: SHARP3D/Utils/ArrayUtils.cs
    startLine: 133
  assemblies:
  - SHARP3D
  namespace: SHARP3D.Utils
  summary: Determines whether the base elements of a jagged or multi-dimensional array are of a primitive type.
  remarks: >-
    This method recursively drills down to the innermost element type of the array.

    For example:


    <ul><li><code>int[][]</code> returns <code>true</code> because the base element is <code>int</code>.</li><li><code>string[][]</code> returns <code>false</code> because the base element is <code>string</code>.</li><li><code>char[][][]</code> returns <code>true</code> because the base element is <code>char</code>.</li></ul>
  example:
  - >-
    <pre><code class="lang-csharp">int[][] jaggedIntArray = new int[2][];

    jaggedIntArray[0] = new int[] { 1, 2, 3 };

    bool isPrimitive = IsBaseElementPrimitive(jaggedIntArray); // Returns true</code></pre>
  syntax:
    content: public static bool IsBaseElementPrimitive(Array array)
    parameters:
    - id: array
      type: System.Array
      description: The input array to check. Can be a jagged array (e.g., <code>int[][]</code>) or multi-dimensional array.
    return:
      type: System.Boolean
      description: >-
        <code>true</code> if the innermost elements of the array are primitive types (e.g., <code>int</code>, <code>char</code>, <code>bool</code>);

        <code>false</code> if the array is <code>null</code>, empty, or the base elements are non-primitive (e.g., <code>string</code>, custom classes).
    content.vb: Public Shared Function IsBaseElementPrimitive(array As Array) As Boolean
  overload: SHARP3D.Utils.ArrayUtils.IsBaseElementPrimitive*
