  summary: Determines if a point is valid based on camera/sign byte, point values, and camera mask.
  remarks: This value can't be trusted. Some people don't log it as specified in the C3D Guidelines. We tried our best to make it work reliably, but if you have any issue with a file, please contact us about it.
