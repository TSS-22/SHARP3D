    id: FromFileStream
    path: SHARP3D/Data/C3dFileDataHelper.cs
    startLine: 30
  assemblies:
  - SHARP3D
  namespace: SHARP3D.Data
  summary: Reads and parses C3D data from a file stream using the provided context.
  example: []
  syntax:
    content: public static (C3dFileData, int) FromFileStream(C3dFileDataContext context)
    parameters:
    - id: context
      type: SHARP3D.Data.DataEntity.C3dFileDataContext
      description: The <xref href="SHARP3D.Data.DataEntity.C3dFileDataContext" data-throw-if-not-resolved="false"></xref> containing file stream and metadata.
    return:
      type: System.ValueTuple{SHARP3D.Data.DataEntity.C3dFileData,System.Int32}
      description: A <xref href="SHARP3D.Data.DataEntity.C3dFileData" data-throw-if-not-resolved="false"></xref> object containing parsed points and analogs. And an int containing the ANALOG:BITS guesstimate.
    content.vb: Public Shared Function FromFileStream(context As C3dFileDataContext) As (C3dFileData, Integer)
  overload: SHARP3D.Data.C3dFileDataHelper.FromFileStream*
  exceptions:
  - type: System.IO.EndOfStreamException
    commentId: T:System.IO.EndOfStreamException
    description: >-
      Many of the file given by the C3D organization as example to test any C3D app present too little data for the amount of frame advertised in regards to their parameters value. 

      Due to the fact that they still showcase valid data till the cutoff, we decided to provide our library with a non punitive approach: this function will read frames from a C3D file till it either reach the number of frame advertised (best case, and what should be the norm) or reach the end of the stream (worst case).

      That said we do not approve of the practice of cutting off mid-frames.
  - type: System.NotSupportedException
    commentId: T:System.NotSupportedException
    description: Thrown if the data type is not supported (neither INT16 nor FLOAT32).
