  assemblies:
  - SHARP3D
  namespace: SHARP3D.Data.DataEntity
  summary: Represents 3D data in a C3D file, including points and analog data.
  remarks: >-
    <p>

    This struct stores 3D point data and analog data as lists of arrays.

    </p>

    <p>

    <strong>Points:</strong> A list of <xref href="SHARP3D.Data.DataEntity.C3dFileDataPoint" data-throw-if-not-resolved="false"></xref> arrays, where each array represents a frame of 3D points.

    </p>

    <p>

    <strong>Analogs:</strong> A list of 2D float arrays, where each array represents a frame of analog data.

    </p>

    <p>

    <strong>Equality:</strong> Two <xref href="SHARP3D.Data.DataEntity.C3dFileData" data-throw-if-not-resolved="false"></xref> instances are considered equal if their <xref href="SHARP3D.Data.DataEntity.C3dFileData.Points" data-throw-if-not-resolved="false"></xref> and <xref href="SHARP3D.Data.DataEntity.C3dFileData.Analogs" data-throw-if-not-resolved="false"></xref> fields are equal.

    </p>
